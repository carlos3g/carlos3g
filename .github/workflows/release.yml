name: Release

on:
  push:
    branches: [master]
    paths:
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Read package metadata
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version already on npm
        id: check
        run: |
          set +e
          PUBLISHED=$(npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version 2>/dev/null)
          if [ -z "$PUBLISHED" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${{ steps.pkg.outputs.version }} not on npm — will publish."
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${{ steps.pkg.outputs.version }} already on npm — skipping. Bump package.json#version to release."
          fi

      - name: Publish to npm
        # Auth via npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
        # Requires the trusted publisher to be configured at
        # https://www.npmjs.com/package/carlos3g/access pointing at this
        # repo + workflow file. Provenance is generated automatically.
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish

      - name: Create GitHub release
        if: steps.check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
